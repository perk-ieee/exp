<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Exp</title>
<style>
  :root{
    --bg:#12141a; --surface:#1c1f28; --border:#333849;
    --text:#eef0f4; --text-dim:#9aa1b2;
    --record:#d9422b; --record-dark:#a02c1a;
    --play:#d99a2b; --play-dark:#a9721a;
    --ink:#1a1200;
  }
  *{ box-sizing:border-box; }
  html{ font-size:18px; }
  body{
    margin:0; min-height:100vh; background:var(--bg); color:var(--text);
    font-family:system-ui,-apple-system,'Segoe UI',sans-serif;
    display:flex; align-items:center; justify-content:center;
    padding-inline:16px; padding-block:40px;
  }
  .card{
    max-width:420px; width:100%; text-align:center;
    display:flex; flex-direction:column; align-items:center; gap:22px;
  }
  h1{ margin:0; font-size:1.6rem; font-weight:700; letter-spacing:-0.01em; }
  p{ margin:0; font-size:0.95rem; color:var(--text-dim); line-height:1.5; }
  .controls{ display:flex; gap:16px; }
  button{
    appearance:none; border:none; border-radius:999px;
    width:130px; height:130px; font-size:1.05rem; font-weight:700;
    color:var(--ink); cursor:pointer;
    box-shadow:0 10px 30px -8px rgba(0,0,0,0.5), inset 0 2px 0 rgba(255,255,255,0.25);
    transition:transform 0.08s ease, opacity 0.15s ease;
  }
  #recordBtn{ background:radial-gradient(circle at 35% 30%, var(--record), var(--record-dark)); }
  #playBtn{ background:radial-gradient(circle at 35% 30%, var(--play), var(--play-dark)); }
  button:active{ transform:scale(0.94); }
  button:focus-visible{ outline:3px solid #fff; outline-offset:4px; }
  button:disabled{ opacity:0.35; cursor:not-allowed; transform:none; }
  .note{ font-size:0.8rem; color:var(--text-dim); max-width:32ch; line-height:1.5; }
  #statusEl{ font-size:0.95rem; color:var(--text); font-weight:600; min-height:1.3em; }
  @media (prefers-reduced-motion:reduce){ button{ transition:none; } }
</style>
</head>
<body>

<div class="card">
  <h1>Exp</h1>
  <p>Record 3 seconds of microphone audio, then play it back.</p>
  <div class="controls">
    <button id="recordBtn" type="button">● Record</button>
    <button id="playBtn" type="button" disabled>▶ Play</button>
  </div>
  <p id="statusEl">No recording yet.</p>
  <p class="note">Recording requires microphone permission. Nothing is uploaded anywhere — the clip stays in this browser tab.</p>
</div>

<script>
(function(){
  var recordBtn = document.getElementById('recordBtn');
  var playBtn = document.getElementById('playBtn');
  var statusEl = document.getElementById('statusEl');

  var RECORD_MS = 3000;
  var recordedBlobUrl = null;

  function setStatus(text){
    statusEl.textContent = text;
  }

  function pickMimeType(){
    if (!window.MediaRecorder || !MediaRecorder.isTypeSupported) return '';
    var candidates = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm', 'audio/ogg;codecs=opus'];
    for (var i = 0; i < candidates.length; i++){
      if (MediaRecorder.isTypeSupported(candidates[i])) return candidates[i];
    }
    return '';
  }

  function startRecording(){
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia || !window.MediaRecorder){
      setStatus('Recording is not supported in this browser.');
      return;
    }

    recordBtn.disabled = true;
    playBtn.disabled = true;
    setStatus('Requesting microphone access…');

    navigator.mediaDevices.getUserMedia({ audio: true }).then(function(stream){
      var chunks = [];
      var mimeType = pickMimeType();
      var recorder;
      try {
        recorder = mimeType ? new MediaRecorder(stream, { mimeType: mimeType }) : new MediaRecorder(stream);
      } catch (e){
        recorder = new MediaRecorder(stream);
      }

      recorder.addEventListener('dataavailable', function(e){
        if (e.data && e.data.size > 0) chunks.push(e.data);
      });

      recorder.addEventListener('stop', function(){
        stream.getTracks().forEach(function(t){ t.stop(); });
        if (recordedBlobUrl) URL.revokeObjectURL(recordedBlobUrl);
        var blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        recordedBlobUrl = URL.createObjectURL(blob);
        recordBtn.disabled = false;
        playBtn.disabled = false;
        setStatus('Recording ready — press Play.');
      });

      recorder.start();
      var secondsLeft = Math.ceil(RECORD_MS / 1000);
      setStatus('Recording… ' + secondsLeft + 's');
      var countdown = setInterval(function(){
        secondsLeft -= 1;
        if (secondsLeft > 0) setStatus('Recording… ' + secondsLeft + 's');
      }, 1000);

      setTimeout(function(){
        clearInterval(countdown);
        if (recorder.state !== 'inactive') recorder.stop();
      }, RECORD_MS);

    }).catch(function(err){
      recordBtn.disabled = false;
      setStatus('Microphone access denied or unavailable (' + (err && err.message ? err.message : err) + ').');
    });
  }

  function playRecording(){
    if (!recordedBlobUrl){
      setStatus('No recording yet — press Record first.');
      return;
    }
    var audio = new Audio(recordedBlobUrl);
    setStatus('Playing…');
    audio.addEventListener('ended', function(){
      setStatus('Recording ready — press Play.');
    });
    audio.play().catch(function(err){
      setStatus('Could not play recording (' + (err && err.message ? err.message : err) + ').');
    });
  }

  recordBtn.addEventListener('click', startRecording);
  playBtn.addEventListener('click', playRecording);
})();
</script>
</body>
</html>
